name: Package releases
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Packages · {0}', fromJSON(inputs.request).intent) || format('Release · {0}', github.ref_name) }}
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  notify:
    if: github.event_name == 'push' && github.event.deleted == false
    uses: SNodeC/DistributionPackages/.github/workflows/notify-release.yml@main
    secrets:
      PACKAGE_NOTIFY_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_NOTIFY_APP_PRIVATE_KEY }}
  build:
    if: github.event_name == 'workflow_dispatch'
    uses: SNodeC/DistributionPackages/.github/workflows/build-packages.yml@main
    secrets:
      PACKAGE_CAPTURE_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_CAPTURE_APP_PRIVATE_KEY }}
      PACKAGE_NOTIFY_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_NOTIFY_APP_PRIVATE_KEY }}
