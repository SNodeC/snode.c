name: Package releases — SNode.C
run-name: Packages · ${{ github.event.client_payload.capture || github.run_id }} · ${{ github.event.client_payload.target || '-' }}
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  repository_dispatch:
    types: [build-packages]
permissions:
  contents: read
  actions: read
jobs:
  notify:
    if: github.event_name == 'push' && github.event.deleted == false
    uses: SNodeC/DistributionPackages/.github/workflows/notify-release.yml@main
    secrets:
      OPENWRT_APP_PRIVATE_KEY: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
  build:
    if: github.event_name == 'repository_dispatch'
    uses: SNodeC/DistributionPackages/.github/workflows/build-packages.yml@main
    secrets:
      OPENWRT_APP_PRIVATE_KEY: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
