name: Build distribution packages
run-name: Packages · ${{ github.event.client_payload.capture || github.ref_name }} · ${{ github.event.client_payload.target || '-' }}
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  repository_dispatch:
    types: [package-build]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}/feed
  BUILD_PROJECT: snode.c
  TARGET_ID: ${{ github.event.client_payload.target || '-' }}
  PUBLISHED_REF: ${{ github.event.client_payload.publication }}
  BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  release:
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages
          permission-contents: write
      - name: Request release package build
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 0
          jq '{event_type: "release-tag-changed", client_payload: {
            repository: .repository.full_name, ref: .ref,
            before: .before, after: .after, deleted: .deleted
          }}' "$GITHUB_EVENT_PATH" |
            gh api --method POST repos/SNodeC/DistributionPackages/dispatches --input -
  prepare:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      revisions: ${{ steps.matrix.outputs.revisions }}
    steps: &capture_steps
      - uses: actions/create-github-app-token@v3
        id: capture
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages,Packages
          permission-actions: read
          permission-contents: write
      - uses: actions/download-artifact@v8
        with:
          repository: SNodeC/DistributionPackages
          run-id: ${{ github.event.client_payload.capture }}
          github-token: ${{ steps.capture.outputs.token }}
          name: source-pair
          path: bundle
      - name: Read captured targets or finalize interrupted builds
        id: matrix
        env:
          PACKAGES_TOKEN: ${{ steps.capture.outputs.token }}
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          if [ -n "${FINAL_STATUS:-}" ]; then
            bash feed/ci/publish/status.sh published finalize bundle "$FINAL_STATUS"
          else
            python3 -m ci.dispatch plan bundle "$BUILD_PROJECT" "$TARGET_ID" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build and test · ${{ matrix.distribution }} · ${{ matrix.suite }} · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: package-build-${{ github.event.client_payload.capture }}-${{ matrix.build_slot }}
      cancel-in-progress: false
      queue: max
    env:
      TARGET_ID: ${{ matrix.id }}
      PACKAGE_RELEASE: ${{ fromJSON(needs.prepare.outputs.revisions)['snode.c'] }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: capture
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages
          permission-actions: read
          permission-contents: read
      - uses: actions/download-artifact@v8
        with:
          repository: SNodeC/DistributionPackages
          run-id: ${{ github.event.client_payload.capture }}
          github-token: ${{ steps.capture.outputs.token }}
          name: source-pair
          path: bundle
      - name: Unpack captured packaging tools
        run: |
          mkdir feed status-bundle
          tar -xzf bundle/feed.tar.gz -C feed
          cp bundle/*.json status-bundle/
      - uses: actions/create-github-app-token@v3
        id: running_status
        continue-on-error: true
        timeout-minutes: 1
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - name: Report build started
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.running_status.outputs.token }}
          TARGET: ${{ toJSON(matrix) }}
        run: bash feed/ci/publish/status.sh published status status-bundle "$TARGET" "$BUILD_PROJECT" running
      - name: Select captured dependencies
        run: |
          if [ "$BUILD_PROJECT" = mqttsuite ] && [ -n "$PUBLISHED_REF" ]; then
            python3 -m ci.dispatch baseline bundle "$TARGET_ID" "$PUBLISHED_REF"
          fi
          python3 -m ci.repository select bundle "$TARGET_ID" "$BUILD_PROJECT" published-snodec
          python3 -m ci.repository reuse bundle "$TARGET_ID" dependencies
      - uses: docker/setup-qemu-action@v4
        if: matrix.family == 'linux' && contains(fromJSON('["armhf", "riscv64"]'), matrix.arch)
        with:
          platforms: arm,riscv64
      - name: Build and test OpenWrt packages
        if: matrix.family == 'openwrt'
        env:
          MATRIX_ROW: ${{ toJSON(matrix.build) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd cmake qemu-user
          python3 -m ci.repository sdk "$MATRIX_ROW" sdk
          bash feed/ci/build/openwrt.sh feed bundle sdk
          python3 -m ci.repository stage sdk bundle output
      - name: Build and test Raspberry Pi OS packages
        if: matrix.family == 'raspberrypi'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          bash feed/ci/build/raspberrypi.sh "$SUITE"
      - name: Build and test Linux packages
        if: matrix.family == 'linux'
        env:
          MATRIX_ROW: ${{ toJSON(matrix.build) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash feed/ci/build/linux.sh "$MATRIX_ROW"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.BUILD_PROJECT }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ env.BUILD_PROJECT }}-${{ matrix.id }}
          include-hidden-files: true
          overwrite: true
          path: |
            logs/
            sdk/logs/
            sdk/.config
            sdk/ci-sdk.json
      - uses: actions/create-github-app-token@v3
        id: publication
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages
          permission-contents: write
      - name: Request signed publication
        id: handoff
        env:
          GH_TOKEN: ${{ steps.publication.outputs.token }}
        run: python3 -m ci.dispatch built status-bundle "$TARGET_ID" "$BUILD_PROJECT"
      - uses: actions/create-github-app-token@v3
        if: ${{ always() }}
        id: ended_status
        continue-on-error: true
        timeout-minutes: 1
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWRT_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: Packages
          permission-contents: write
      - name: Report build ended
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PACKAGES_TOKEN: ${{ steps.ended_status.outputs.token }}
          TARGET: ${{ toJSON(matrix) }}
          BUILD_STATUS: ${{ steps.handoff.outcome == 'success' && 'publishing' || job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: bash feed/ci/publish/status.sh published status status-bundle "$TARGET" "$BUILD_PROJECT" "$BUILD_STATUS"
  finalize:
    needs: [prepare, build]
    if: ${{ always() && github.event_name == 'repository_dispatch' && needs.build.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FINAL_STATUS: ${{ needs.build.result == 'cancelled' && 'cancelled' || 'failed' }}
    steps: *capture_steps
