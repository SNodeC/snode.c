name: Implementation sensitive-config bootstrap

on:
  push:
    branches: ['implementation/1.8-sensitive-config']
    paths:
      - '.github/workflows/implementation-sensitive-bootstrap.yml'

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/1.8-sensitive-config

      - name: Apply sensitive-option support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once('src/utils/SubCommand.h', '    struct ConfigOptionState {\n        ConfigRequirementState required;\n    };', '    struct ConfigOptionState {\n        ConfigRequirementState required;\n        bool sensitive = false;\n    };')
          replace_once('src/utils/SubCommand.h', '        void setCanonicalRequired(CLI::Option* option, bool required);\n        void setSuppression(ConfigSuppressionReason reason, bool suppressed);', '        void setCanonicalRequired(CLI::Option* option, bool required);\n        void setSensitive(CLI::Option* option, bool sensitive);\n        void setSuppression(ConfigSuppressionReason reason, bool suppressed);')
          replace_once('src/utils/SubCommand.h', '        bool canonicalRequired(const CLI::Option* option) const;\n        bool effectiveRequired(const CLI::Option* option) const;', '        bool canonicalRequired(const CLI::Option* option) const;\n        bool effectiveRequired(const CLI::Option* option) const;\n        bool sensitive(const CLI::Option* option) const;')
          replace_once('src/utils/SubCommand.h', '        CLI::Option* setConfigurable(CLI::Option* option, bool configurable) const;\n', '        CLI::Option* setConfigurable(CLI::Option* option, bool configurable) const;\n        CLI::Option* setSensitive(CLI::Option* option, bool sensitive = true) const;\n')

          replace_once('src/utils/SubCommand.cpp', '#include <cstddef>\n#include <cstdint>\n#include <memory>\n#include <set>\n#include <vector>', '#include <cctype>\n#include <cstddef>\n#include <cstdint>\n#include <memory>\n#include <set>\n#include <sstream>\n#include <vector>')
          replace_once('src/utils/SubCommand.cpp', 'namespace utils {\n\n    SubCommand::SubCommand', 'namespace utils {\n\n    namespace {\n        std::set<std::string> collectSensitiveOptionNames(CLI::App* app) {\n            std::set<std::string> names;\n\n            if (const auto* appWithPtr = dynamic_cast<const AppWithPtr*>(app); appWithPtr != nullptr) {\n                for (const CLI::Option* option : app->get_options()) {\n                    if (appWithPtr->sensitive(option)) {\n                        names.insert(option->get_single_name());\n                    }\n                }\n            }\n\n            for (CLI::App* subCommand : app->get_subcommands({})) {\n                const auto childNames = collectSensitiveOptionNames(subCommand);\n                names.insert(childNames.begin(), childNames.end());\n            }\n\n            return names;\n        }\n\n        std::string redactSensitiveConfig(std::string config, const std::set<std::string>& sensitiveNames) {\n            if (sensitiveNames.empty()) {\n                return config;\n            }\n\n            std::istringstream input(config);\n            std::ostringstream output;\n            std::string line;\n            bool firstLine = true;\n\n            while (std::getline(input, line)) {\n                std::string rendered = line;\n                const std::size_t first = line.find_first_not_of(" \\t");\n\n                if (first != std::string::npos) {\n                    for (const std::string& name : sensitiveNames) {\n                        if (line.compare(first, name.size(), name) != 0) {\n                            continue;\n                        }\n\n                        std::size_t pos = first + name.size();\n                        if (pos < line.size() && !std::isspace(static_cast<unsigned char>(line[pos])) && line[pos] != "="[0]) {\n                            continue;\n                        }\n                        while (pos < line.size() && std::isspace(static_cast<unsigned char>(line[pos]))) {\n                            ++pos;\n                        }\n                        if (pos < line.size() && line[pos] == "="[0]) {\n                            rendered = line.substr(0, pos + 1) + "<REDACTED>";\n                            break;\n                        }\n                    }\n                }\n\n                if (!firstLine) {\n                    output << "\\n";\n                }\n                firstLine = false;\n                output << rendered;\n            }\n\n            return output.str();\n        }\n    } // namespace\n\n    SubCommand::SubCommand')
          replace_once('src/utils/SubCommand.cpp', '    std::string SubCommand::configToStr() const {\n        return subCommandApp->config_to_str(true, true);\n    }', '    std::string SubCommand::configToStr() const {\n        return redactSensitiveConfig(subCommandApp->config_to_str(true, true), collectSensitiveOptionNames(subCommandApp));\n    }')
          replace_once('src/utils/SubCommand.cpp', '    CLI::Option* SubCommand::setConfigurable(CLI::Option* option, bool configurable) const {\n        return option //\n            ->configurable(configurable)\n            ->group(subCommandApp->get_formatter()->get_label(configurable ? "Persistent Options" : "Nonpersistent Options"));\n    }', '    CLI::Option* SubCommand::setConfigurable(CLI::Option* option, bool configurable) const {\n        return option //\n            ->configurable(configurable)\n            ->group(subCommandApp->get_formatter()->get_label(configurable ? "Persistent Options" : "Nonpersistent Options"));\n    }\n\n    CLI::Option* SubCommand::setSensitive(CLI::Option* option, bool sensitive) const {\n        subCommandApp->setSensitive(option, sensitive);\n        return option;\n    }')
          replace_once('src/utils/SubCommand.cpp', '    void AppWithPtr::setCanonicalRequired(CLI::Option* option, bool required) {\n        optionState(option).required.canonicalRequired = required;\n        applyEffectiveState();\n    }', '    void AppWithPtr::setCanonicalRequired(CLI::Option* option, bool required) {\n        optionState(option).required.canonicalRequired = required;\n        applyEffectiveState();\n    }\n\n    void AppWithPtr::setSensitive(CLI::Option* option, bool sensitive) {\n        optionState(option).sensitive = sensitive;\n    }')
          replace_once('src/utils/SubCommand.cpp', '    bool AppWithPtr::effectiveRequired(const CLI::Option* option) const {\n        const ConfigOptionState* state = findOptionState(option);\n\n        return state != nullptr && state->required.effectiveRequired;\n    }', '    bool AppWithPtr::effectiveRequired(const CLI::Option* option) const {\n        const ConfigOptionState* state = findOptionState(option);\n\n        return state != nullptr && state->required.effectiveRequired;\n    }\n\n    bool AppWithPtr::sensitive(const CLI::Option* option) const {\n        const ConfigOptionState* state = findOptionState(option);\n\n        return state != nullptr && state->sensitive;\n    }')

          replace_once('src/utils/Config.cpp', '            for (const CLI::Option* option : app->get_options()) {\n                if (option->get_configurable()) {\n                    std::string value;\n\n                    switch (mode) {', '            for (const CLI::Option* option : app->get_options()) {\n                if (option->get_configurable()) {\n                    std::string value;\n                    const auto* appWithPtr = dynamic_cast<const AppWithPtr*>(app);\n                    const bool sensitive = appWithPtr != nullptr && appWithPtr->sensitive(option);\n\n                    switch (mode) {')
          replace_once('src/utils/Config.cpp', '                    if (!value.empty()) {\n                        if (value.starts_with(std::string{"["}) && value.ends_with("]")) {', '                    if (sensitive && !value.empty() && value != "<REQUIRED>" && value != "\\\"\\\"") {\n                        value = "<REDACTED>";\n                    }\n\n                    if (!value.empty()) {\n                        if (value.starts_with(std::string{"["}) && value.ends_with("]")) {')
          replace_once('src/utils/Config.cpp', '                        if (value != "<REQUIRED>" && value != "\\\"\\\"" && !value.starts_with("<[")) {\n                            value = bash_backslash_escape_no_whitespace(value);\n                        }', '                        if (value != "<REQUIRED>" && value != "<REDACTED>" && value != "\\\"\\\"" && !value.starts_with("<[")) {\n                            value = bash_backslash_escape_no_whitespace(value);\n                        }')

          test_b64 = ''
          Path('tests/unit/utils/SensitiveConfigOptionTest.cpp').write_bytes(base64.b64decode(test_b64))

          cmake_path = Path('tests/unit/utils/CMakeLists.txt')
          cmake = cmake_path.read_text()
          if 'SensitiveConfigOptionTest' in cmake:
              raise SystemExit('SensitiveConfigOptionTest already registered unexpectedly')
          cmake_path.write_text(cmake.rstrip() + '\n\nsnodec_add_test(SensitiveConfigOptionTest SensitiveConfigOptionTest.cpp)\ntarget_link_libraries(SensitiveConfigOptionTest PRIVATE snodec-test-support snodec::utils)\nset_tests_properties(SensitiveConfigOptionTest PROPERTIES LABELS "unit;utils;config;security" TIMEOUT 5)\n')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libbluetooth-dev libmagic-dev libmariadb-dev libssl-dev nlohmann-json3-dev pkg-config

      - name: Configure focused test build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=OFF

      - name: Build sensitive-option test
        run: cmake --build build --target SensitiveConfigOptionTest --parallel 2

      - name: Run sensitive-option test
        run: ctest --test-dir build --output-on-failure -R '^SensitiveConfigOptionTest$'

      - name: Validate patch
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implementation-sensitive-bootstrap.yml
          git add src/utils/SubCommand.h src/utils/SubCommand.cpp src/utils/Config.cpp tests/unit/utils/CMakeLists.txt tests/unit/utils/SensitiveConfigOptionTest.cpp
          git commit -m 'Add sensitive configuration option support'
          git push origin HEAD:implementation/1.8-sensitive-config
