name: Implementation sensitive-config bootstrap

on:
  push:
    branches:
      - implementation/1.8-sensitive-config
    paths:
      - .github/workflows/implementation-sensitive-bootstrap.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/1.8-sensitive-config

      - name: Apply sensitive-option support
        run: python3 .github/implementation_sensitive.py

      - name: Normalize config key spelling and instrument synthetic test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/utils/SubCommand.cpp')
          text = p.read_text()
          old = '                        names.insert(option->get_single_name());'
          new = '''                        std::string name = option->get_single_name();
                        name.erase(0, name.find_first_not_of('-'));
                        names.insert(name);'''
          if text.count(old) != 1:
              raise SystemExit('expected sensitive name insertion not found exactly once')
          p.write_text(text.replace(old, new, 1))

          t = Path('tests/unit/utils/SensitiveConfigOptionTest.cpp')
          text = t.read_text()
          old = '    const std::string serialized = root.configToStr();\n'
          new = old + '    std::cerr << "SERIALIZED=[" << serialized << "]" << std::endl;\n'
          if text.count(old) != 1:
              raise SystemExit('test instrumentation point missing')
          t.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libbluetooth-dev libmagic-dev libmariadb-dev libssl-dev nlohmann-json3-dev pkg-config

      - name: Configure focused test build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=OFF

      - name: Build sensitive-option test
        run: cmake --build build --target SensitiveConfigOptionTest --parallel 2

      - name: Run sensitive-option test
        run: ctest --test-dir build --output-on-failure -R '^SensitiveConfigOptionTest$'
