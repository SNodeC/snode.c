name: Notify package status
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [core-ci source build]
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint existing status-notification App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: '5453314'
          private-key: ${{ secrets.PACKAGE_NOTIFY_APP_PRIVATE_KEY }}
          owner: SNodeC
          repositories: DistributionPackages
          permission-actions: write
      - name: Request a presentation-only refresh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run core-ci-status.yml --repo SNodeC/DistributionPackages --ref main
