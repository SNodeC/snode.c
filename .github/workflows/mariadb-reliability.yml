name: MariaDB reliability
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the validator build dependency
        run: git submodule update --init --recursive src/mcp/json-schema-validator
      - name: Install build and disposable database dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev nlohmann-json3-dev libmagic-dev libbluetooth-dev libmariadb-dev libncurses-dev libpcre2-dev mariadb-server
      - name: Configure and build
        run: |
          mkdir -p "${{ runner.temp }}/snodec-reliability/tmp"
          export TMPDIR="${{ runner.temp }}/snodec-reliability/tmp"
          cmake -S . -B "${{ runner.temp }}/snodec-reliability" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=ON -DCHECK_INCLUDES=OFF
          cmake --build "${{ runner.temp }}/snodec-reliability" --parallel 2
      - name: Run full CTest twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: ${{ runner.temp }}/snodec-reliability/tmp
        run: |
          ctest --test-dir "${{ runner.temp }}/snodec-reliability" --output-on-failure --parallel 4
          ctest --test-dir "${{ runner.temp }}/snodec-reliability" --output-on-failure --parallel 4
