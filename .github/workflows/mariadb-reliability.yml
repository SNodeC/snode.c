name: MariaDB reliability
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and disposable database dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev nlohmann-json3-dev libmagic-dev libbluetooth-dev libmariadb-dev libncurses-dev mariadb-server
      - name: Configure and build
        run: |
          mkdir -p /tmp/codex/build/snode.c/reliability/tmp
          export TMPDIR=/tmp/codex/build/snode.c/reliability/tmp
          cmake -S . -B /tmp/codex/build/snode.c/reliability -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=ON -DCHECK_INCLUDES=OFF
          cmake --build /tmp/codex/build/snode.c/reliability --parallel 2
      - name: Run full CTest twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: /tmp/codex/build/snode.c/reliability/tmp
        run: |
          ctest --test-dir /tmp/codex/build/snode.c/reliability --output-on-failure --parallel 4
          ctest --test-dir /tmp/codex/build/snode.c/reliability --output-on-failure --parallel 4
