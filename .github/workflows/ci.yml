name: CI

on:
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'

jobs:
  gcc-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Create source snapshot
        run: |
          git rev-parse 'HEAD^{tree}' > /tmp/base-tree-sha.txt
          tar --exclude=.git -czf /tmp/snodec-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: agent-source-export
          path: |
            /tmp/snodec-source.tar.gz
            /tmp/base-tree-sha.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libbluetooth-dev \
            libmagic-dev \
            libmariadb-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Tests
        run: ctest --test-dir build --output-on-failure
