name: CI

on:
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'

jobs:
  gcc-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            dpkg-dev \
            g++ \
            libbluetooth-dev \
            libmagic-dev \
            libmariadb-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX=/usr
          -DSNODEC_BUILD_TESTS=ON
          -DSNODEC_BUILD_APPS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Component packages
        run: |
          rm -rf build/_packages
          cpack --config build/CPackConfig.cmake -G DEB

      - name: Validate component packages
        run: |
          cmake \
            -DPACKAGE_DIR=${{ github.workspace }}/build/_packages \
            -DCPACK_CONFIG=${{ github.workspace }}/build/CPackConfig.cmake \
            -P cmake/ValidateComponentPackages.cmake
