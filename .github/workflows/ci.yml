name: CI

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

jobs:
  gcc-debug:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libbluetooth-dev \
            libmagic-dev \
            libmariadb-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSNODEC_BUILD_TESTS=ON -DSNODEC_BUILD_APPS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Install SNode.C for external examples
        run: cmake --install build --prefix "$RUNNER_TEMP/snodec-install"

      - name: Configure external echo example
        run: |
          cmake -S examples/echo -B build-examples-echo \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/snodec-install"

      - name: Build external echo example
        run: cmake --build build-examples-echo --parallel 2

      - name: External echo CTests
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/snodec-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ctest --test-dir build-examples-echo --output-on-failure
