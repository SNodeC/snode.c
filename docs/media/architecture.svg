<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 630" role="img" aria-labelledby="snodec-architecture-title snodec-architecture-desc"><title id="snodec-architecture-title">SNode.C architecture</title><desc id="snodec-architecture-desc">Clients connect and servers listen. Application protocols use per-connection contexts above transport and the shared event runtime. This is a layering diagram, not a thread diagram.</desc><defs><linearGradient id="snodec-architecture-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-architecture-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="630" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="47" font-size="24" fill="#14243b" font-weight="700">ONE MODEL, FROM PROTOCOL TO SOCKET</text><rect x="330" y="86" width="908" height="100" rx="14" fill="#e3effc" stroke="#d0dce9"/><text x="352" y="121" font-size="21" fill="#14243b" font-weight="700">YOUR APPLICATION</text><text x="352" y="158" font-size="24" fill="#506178" font-weight="400">Routes, events, MQTT messages, custom framing</text><path d="M784 190V210" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="330" y="214" width="908" height="100" rx="14" fill="#e5f4f1" stroke="#d0dce9"/><text x="352" y="249" font-size="21" fill="#14243b" font-weight="700">SocketContextFactory / SocketContext</text><text x="352" y="286" font-size="24" fill="#506178" font-weight="400">A factory creates one context for each connection</text><path d="M784 318V338" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="330" y="342" width="908" height="100" rx="14" fill="#edf0fb" stroke="#d0dce9"/><text x="352" y="377" font-size="21" fill="#14243b" font-weight="700">CONNECTION + TRANSPORT</text><text x="352" y="414" font-size="24" fill="#506178" font-weight="400">Buffered I/O · plain or TLS · IP, Unix, Bluetooth</text><path d="M784 446V466" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="330" y="470" width="908" height="100" rx="14" fill="#e8edf4" stroke="#d0dce9"/><text x="352" y="505" font-size="21" fill="#14243b" font-weight="700">EVENT-DRIVEN RUNTIME</text><text x="352" y="542" font-size="24" fill="#506178" font-weight="400">Readiness · timers · signals · select / poll / epoll</text><rect x="32" y="86" width="260" height="228" rx="18" fill="#142c46" stroke="none"/><text x="56" y="150" font-size="21" fill="#75caff" font-weight="700">CLIENT</text><text x="56" y="202" font-size="27" fill="#ffffff" font-weight="400">connect()</text><text x="56" y="248" font-size="22" fill="#c7d8e8" font-weight="400">Outbound peers</text><rect x="32" y="342" width="260" height="228" rx="18" fill="#153f3c" stroke="none"/><text x="56" y="406" font-size="21" fill="#78e4ba" font-weight="700">SERVER</text><text x="56" y="458" font-size="27" fill="#ffffff" font-weight="400">listen()</text><text x="56" y="504" font-size="22" fill="#c7d8e8" font-weight="400">Accepted peers</text><path d="M296 200H311V264H326M296 456H311V264" fill="none" stroke="#7c8fa5" stroke-width="2"/><text x="330" y="609" font-size="19" fill="#506178" font-weight="400">Layers build on the runtime below. Lines show structure, not message flow.</text></g></svg>
