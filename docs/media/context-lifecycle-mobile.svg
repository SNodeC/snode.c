<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 984" role="img" aria-labelledby="snodec-context-lifecycle-mobile-title snodec-context-lifecycle-mobile-desc"><title id="snodec-context-lifecycle-mobile-title">SNode.C context lifecycle</title><desc id="snodec-context-lifecycle-mobile-desc">One factory per server/client instance creates a separate context for each peer after connection establishment. Attachment, repeated receive and detachment callbacks run on the event loop. The framework deletes detached contexts. A protocol switch can detach a context without closing the connection.</desc><defs><linearGradient id="snodec-context-lifecycle-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-context-lifecycle-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6b7f96" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="984" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="48" font-size="26" fill="#14243b" font-weight="700">ONE CONTEXT FOR EACH PEER</text><text x="32" y="82" font-size="21" fill="#506178" font-weight="400">One factory creates a context for each peer.</text><rect x="32" y="115" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="149" font-size="24" fill="#14243b" font-weight="700">Connection established</text><text x="52" y="183" font-size="22" fill="#506178" font-weight="400">Client connects / server accepts</text><path d="M320 209L320 235" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="241" width="576" height="88" rx="14" fill="#dcebf9" stroke="#ccd9e8"/><text x="52" y="275" font-size="24" fill="#14243b" font-weight="700">Factory::create(connection)</text><text x="52" y="309" font-size="22" fill="#506178" font-weight="400">One factory per server/client instance</text><path d="M320 335L320 361" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="367" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="401" font-size="24" fill="#14243b" font-weight="700">onConnected()</text><text x="52" y="435" font-size="22" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M320 461L320 487" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="493" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="527" font-size="24" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="52" y="561" font-size="22" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M320 587L320 613" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="619" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="653" font-size="24" fill="#14243b" font-weight="700">onDisconnected()</text><text x="52" y="687" font-size="22" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M320 713L320 739" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="745" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="779" font-size="24" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="52" y="813" font-size="22" fill="#506178" font-weight="400">No application-side delete</text><text x="32" y="885" font-size="22" fill="#14243b" font-weight="700">Callbacks run on the shared event loop.</text><text x="32" y="925" font-size="21" fill="#506178" font-weight="400">A protocol switch can detach a context</text><text x="32" y="955" font-size="21" fill="#506178" font-weight="400">without closing the connection.</text></g></svg>
