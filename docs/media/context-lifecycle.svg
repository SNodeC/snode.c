<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 990" role="img" aria-labelledby="snodec-context-lifecycle-title snodec-context-lifecycle-desc"><title id="snodec-context-lifecycle-title">SNode.C context lifecycle</title><desc id="snodec-context-lifecycle-desc">One factory per server/client instance creates a separate context for each peer after connection establishment. Attachment, repeated receive and detachment callbacks run on the event loop. The framework deletes detached contexts. A protocol switch can detach a context without closing the connection.</desc><defs><linearGradient id="snodec-context-lifecycle-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-context-lifecycle-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6b7f96" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="990" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="48" font-size="28" fill="#14243b" font-weight="700">ONE CONTEXT FOR EACH PEER</text><text x="32" y="82" font-size="23" fill="#506178" font-weight="400">One factory per server/client instance; a separate context and receive buffer for each peer.</text><rect x="32" y="120" width="1216" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="150" font-size="23" fill="#14243b" font-weight="700">Connections established</text><text x="52" y="177" font-size="20" fill="#506178" font-weight="400">Clients connect / server accepts</text><path d="M640 200L640 226" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="232" width="1216" height="74" rx="14" fill="#dcebf9" stroke="#ccd9e8"/><text x="52" y="262" font-size="23" fill="#14243b" font-weight="700">SocketContextFactory (one per server/client instance)</text><text x="52" y="289" font-size="20" fill="#506178" font-weight="400">The same factory creates an independent context for each connection</text><path d="M312 312L312 338" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><text x="334" y="332" font-size="18" fill="#506178" font-weight="400">create()</text><rect x="32" y="344" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="374" font-size="23" fill="#14243b" font-weight="700">Context A</text><text x="52" y="401" font-size="20" fill="#506178" font-weight="400">Protocol state owned by this peer</text><path d="M312 424L312 450" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="456" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="486" font-size="23" fill="#14243b" font-weight="700">onConnected()</text><text x="52" y="513" font-size="20" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M312 536L312 562" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="568" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="598" font-size="23" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="52" y="625" font-size="20" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M312 648L312 674" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="680" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="710" font-size="23" fill="#14243b" font-weight="700">onDisconnected()</text><text x="52" y="737" font-size="20" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M312 760L312 786" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="792" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="822" font-size="23" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="52" y="849" font-size="20" fill="#506178" font-weight="400">No application-side delete</text><path d="M598 581H622V629H598" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><path d="M936 312L936 338" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><text x="958" y="332" font-size="18" fill="#506178" font-weight="400">create()</text><rect x="656" y="344" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="374" font-size="23" fill="#14243b" font-weight="700">Context B</text><text x="676" y="401" font-size="20" fill="#506178" font-weight="400">Protocol state owned by this peer</text><path d="M936 424L936 450" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="456" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="486" font-size="23" fill="#14243b" font-weight="700">onConnected()</text><text x="676" y="513" font-size="20" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M936 536L936 562" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="568" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="598" font-size="23" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="676" y="625" font-size="20" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M936 648L936 674" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="680" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="710" font-size="23" fill="#14243b" font-weight="700">onDisconnected()</text><text x="676" y="737" font-size="20" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M936 760L936 786" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="792" width="560" height="74" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="822" font-size="23" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="676" y="849" font-size="20" fill="#506178" font-weight="400">No application-side delete</text><path d="M1222 581H1246V629H1222" fill="none" stroke="#6b7f96" stroke-width="2.5" marker-end="url(#snodec-context-lifecycle-arrow)"/><text x="32" y="924" font-size="23" fill="#14243b" font-weight="700">Callbacks run on the shared event loop.</text><text x="32" y="960" font-size="21" fill="#506178" font-weight="400">A protocol switch can detach a context without closing the connection.</text></g></svg>
