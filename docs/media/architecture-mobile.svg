<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 910" role="img" aria-labelledby="snodec-architecture-mobile-title snodec-architecture-mobile-desc"><title id="snodec-architecture-mobile-title">SNode.C architecture</title><desc id="snodec-architecture-mobile-desc">Clients connect and servers listen. Application protocols use per-connection contexts above transport and the shared event runtime. This is a layering diagram, not a thread diagram.</desc><defs><linearGradient id="snodec-architecture-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-architecture-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="910" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="47" font-size="21" fill="#14243b" font-weight="700">ONE MODEL, FROM PROTOCOL TO SOCKET</text><rect x="32" y="265" width="576" height="116" rx="14" fill="#e3effc" stroke="#d0dce9"/><text x="54" y="299" font-size="21" fill="#14243b" font-weight="700">YOUR APPLICATION</text><text x="54" y="328" font-size="21" fill="#506178" font-weight="400">Routes, events, MQTT messages,</text><text x="54" y="354" font-size="21" fill="#506178" font-weight="400">custom framing</text><path d="M320 385V405" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="32" y="409" width="576" height="116" rx="14" fill="#e5f4f1" stroke="#d0dce9"/><text x="54" y="443" font-size="21" fill="#14243b" font-weight="700">SocketContextFactory / SocketContext</text><text x="54" y="472" font-size="21" fill="#506178" font-weight="400">A factory creates one context</text><text x="54" y="498" font-size="21" fill="#506178" font-weight="400">for each connection</text><path d="M320 529V549" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="32" y="553" width="576" height="116" rx="14" fill="#edf0fb" stroke="#d0dce9"/><text x="54" y="587" font-size="21" fill="#14243b" font-weight="700">CONNECTION + TRANSPORT</text><text x="54" y="616" font-size="21" fill="#506178" font-weight="400">Buffered I/O · plain or TLS ·</text><text x="54" y="642" font-size="21" fill="#506178" font-weight="400">IP, Unix, Bluetooth</text><path d="M320 673V693" fill="none" stroke="#7c8fa5" stroke-width="2"/><rect x="32" y="697" width="576" height="116" rx="14" fill="#e8edf4" stroke="#d0dce9"/><text x="54" y="731" font-size="21" fill="#14243b" font-weight="700">EVENT-DRIVEN RUNTIME</text><text x="54" y="760" font-size="21" fill="#506178" font-weight="400">Readiness · timers · signals</text><text x="54" y="786" font-size="21" fill="#506178" font-weight="400">select / poll / epoll</text><rect x="32" y="83" width="278" height="146" rx="18" fill="#142c46" stroke="none"/><rect x="330" y="83" width="278" height="146" rx="18" fill="#153f3c" stroke="none"/><text x="52" y="120" font-size="21" fill="#75caff" font-weight="700">CLIENT</text><text x="52" y="161" font-size="25" fill="#ffffff" font-weight="400">connect()</text><text x="52" y="198" font-size="19" fill="#c7d8e8" font-weight="400">Outbound peers</text><text x="350" y="120" font-size="21" fill="#78e4ba" font-weight="700">SERVER</text><text x="350" y="161" font-size="25" fill="#ffffff" font-weight="400">listen()</text><text x="350" y="198" font-size="19" fill="#c7d8e8" font-weight="400">Accepted peers</text><path d="M171 233V246H22V467H28M469 233V246H618V467H612" fill="none" stroke="#7c8fa5" stroke-width="2"/><text x="32" y="856" font-size="22" fill="#14243b" font-weight="400">Layers build on the runtime below.</text><text x="32" y="886" font-size="21" fill="#506178" font-weight="400">Lines show structure, not message flow.</text></g></svg>
