<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 880" role="img" aria-labelledby="snodec-context-lifecycle-mobile-title snodec-context-lifecycle-mobile-desc"><title id="snodec-context-lifecycle-mobile-title">SNode.C context lifecycle</title><desc id="snodec-context-lifecycle-mobile-desc">Each peer gets a separate context. The factory creates it after connection establishment; attachment, receive and detachment callbacks run on the event loop. The framework deletes detached contexts. A protocol switch can detach a context without closing the connection.</desc><defs><linearGradient id="snodec-context-lifecycle-mobile-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-context-lifecycle-mobile-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="640" height="880" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="48" font-size="26" fill="#14243b" font-weight="700">ONE CONTEXT FOR EACH PEER</text><text x="32" y="82" font-size="21" fill="#506178" font-weight="400">A connection has its own protocol lifetime.</text><rect x="32" y="115" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="149" font-size="24" fill="#14243b" font-weight="700">Connection established</text><text x="52" y="183" font-size="22" fill="#506178" font-weight="400">Client connects / server accepts</text><path d="M320 206L320 224" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="231" width="576" height="88" rx="14" fill="#dcebf9" stroke="#ccd9e8"/><text x="52" y="265" font-size="24" fill="#14243b" font-weight="700">Factory::create(connection)</text><text x="52" y="299" font-size="22" fill="#506178" font-weight="400">Returns a new SocketContext</text><path d="M320 322L320 340" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="347" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="381" font-size="24" fill="#14243b" font-weight="700">onConnected()</text><text x="52" y="415" font-size="22" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M320 438L320 456" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="463" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="497" font-size="24" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="52" y="531" font-size="22" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M320 554L320 572" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="579" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="613" font-size="24" fill="#14243b" font-weight="700">onDisconnected()</text><text x="52" y="647" font-size="22" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M320 670L320 688" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-mobile-arrow)"/><rect x="32" y="695" width="576" height="88" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="729" font-size="24" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="52" y="763" font-size="22" fill="#506178" font-weight="400">No application-side delete</text><text x="32" y="832" font-size="22" fill="#14243b" font-weight="700">Callbacks run on the shared event loop.</text><text x="32" y="862" font-size="21" fill="#506178" font-weight="400">A protocol switch can also detach a context.</text></g></svg>
