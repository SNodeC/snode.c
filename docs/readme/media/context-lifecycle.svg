<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 710" role="img" aria-labelledby="snodec-context-lifecycle-title snodec-context-lifecycle-desc"><title id="snodec-context-lifecycle-title">SNode.C context lifecycle</title><desc id="snodec-context-lifecycle-desc">Each peer gets a separate context. The factory creates it after connection establishment; attachment, receive and detachment callbacks run on the event loop. The framework deletes detached contexts. A protocol switch can detach a context without closing the connection.</desc><defs><linearGradient id="snodec-context-lifecycle-bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#172f47"/></linearGradient><marker id="snodec-context-lifecycle-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7c8fa5" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1280" height="710" rx="22" fill="#f5f8fc" stroke="none"/><text x="32" y="48" font-size="28" fill="#14243b" font-weight="700">ONE CONTEXT FOR EACH PEER</text><text x="32" y="82" font-size="23" fill="#506178" font-weight="400">Two peers share a factory, not a context or receive buffer.</text><text x="32" y="122" font-size="21" fill="#246087" font-weight="700">PEER A · CONTEXT A</text><rect x="32" y="143" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="170" font-size="23" fill="#14243b" font-weight="700">Connection established</text><text x="52" y="195" font-size="20" fill="#506178" font-weight="400">Client connects / server accepts</text><path d="M328 212L328 221" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="227" width="592" height="66" rx="14" fill="#dcebf9" stroke="#ccd9e8"/><text x="52" y="254" font-size="23" fill="#14243b" font-weight="700">Factory::create(connection)</text><text x="52" y="279" font-size="20" fill="#506178" font-weight="400">Returns a new SocketContext</text><path d="M328 296L328 305" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="311" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="338" font-size="23" fill="#14243b" font-weight="700">onConnected()</text><text x="52" y="363" font-size="20" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M328 380L328 389" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="395" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="422" font-size="23" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="52" y="447" font-size="20" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M328 464L328 473" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="479" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="506" font-size="23" fill="#14243b" font-weight="700">onDisconnected()</text><text x="52" y="531" font-size="20" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M328 548L328 557" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="32" y="563" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="52" y="590" font-size="23" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="52" y="615" font-size="20" fill="#506178" font-weight="400">No application-side delete</text><text x="656" y="122" font-size="21" fill="#23745f" font-weight="700">PEER B · CONTEXT B</text><rect x="656" y="143" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="170" font-size="23" fill="#14243b" font-weight="700">Connection established</text><text x="676" y="195" font-size="20" fill="#506178" font-weight="400">Client connects / server accepts</text><path d="M952 212L952 221" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="227" width="592" height="66" rx="14" fill="#dcebf9" stroke="#ccd9e8"/><text x="676" y="254" font-size="23" fill="#14243b" font-weight="700">Factory::create(connection)</text><text x="676" y="279" font-size="20" fill="#506178" font-weight="400">Returns a new SocketContext</text><path d="M952 296L952 305" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="311" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="338" font-size="23" fill="#14243b" font-weight="700">onConnected()</text><text x="676" y="363" font-size="20" fill="#506178" font-weight="400">Context is attached and ready</text><path d="M952 380L952 389" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="395" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="422" font-size="23" fill="#14243b" font-weight="700">onReceivedFromPeer()</text><text x="676" y="447" font-size="20" fill="#506178" font-weight="400">Repeated as input becomes available</text><path d="M952 464L952 473" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="479" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="506" font-size="23" fill="#14243b" font-weight="700">onDisconnected()</text><text x="676" y="531" font-size="20" fill="#506178" font-weight="400">Release per-peer application resources</text><path d="M952 548L952 557" fill="none" stroke="#7c8fa5" stroke-width="3" marker-end="url(#snodec-context-lifecycle-arrow)"/><rect x="656" y="563" width="592" height="66" rx="14" fill="#ffffff" stroke="#ccd9e8"/><text x="676" y="590" font-size="23" fill="#14243b" font-weight="700">Framework deletes the context</text><text x="676" y="615" font-size="20" fill="#506178" font-weight="400">No application-side delete</text><text x="32" y="662" font-size="23" fill="#14243b" font-weight="700">Callbacks run on the shared event loop.</text><text x="32" y="692" font-size="21" fill="#506178" font-weight="400">A protocol switch can detach a context without closing the underlying connection.</text></g></svg>
